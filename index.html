<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김병혁 후보 선거운동 지원 일정 취합</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #667085;
      --line: #d7dde6;
      --panel: #ffffff;
      --paper: #f7f8fb;
      --blue: #1f62c9;
      --red: #d63b38;
      --green: #157f5b;
      --navy: #17233f;
      --yellow: #f8c846;
      --shadow: 0 12px 32px rgba(23, 35, 63, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(31, 98, 201, 0.11), transparent 30rem),
        linear-gradient(180deg, #eef3fb 0%, var(--paper) 19rem, #fff 100%);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .masthead {
      padding: 28px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.12;
      letter-spacing: 0;
      color: var(--navy);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-bottom: 12px;
      padding: 8px 12px;
      border: 1px solid rgba(31, 98, 201, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--blue);
      font-weight: 700;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(215, 221, 230, 0.92);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .form-panel {
      padding: 22px;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(180px, 320px) minmax(150px, 210px) auto minmax(180px, 1fr);
      gap: 14px;
      align-items: end;
      margin-bottom: 22px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--navy);
      font-weight: 800;
    }

    .name-input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .pin-input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      background: #fff;
      color: var(--ink);
      letter-spacing: 0;
      outline: none;
    }

    .name-input:focus,
    .pin-input:focus,
    .time-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31, 98, 201, 0.14);
    }

    .status {
      color: var(--green);
      font-weight: 800;
      min-height: 24px;
      align-self: center;
    }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .date-card {
      display: grid;
      gap: 12px;
      min-height: 214px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .date-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .date-label {
      font-size: 22px;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: 0;
    }

    .date-label.sat {
      color: var(--blue);
    }

    .date-label.sun {
      color: var(--red);
    }

    .day-name {
      color: var(--muted);
      font-weight: 800;
      font-size: 15px;
    }

    .day-name.sat {
      color: var(--blue);
    }

    .day-name.sun {
      color: var(--red);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice {
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      inset: 0;
    }

    .choice span {
      display: grid;
      place-items: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .choice input:checked + span {
      border-color: var(--blue);
      background: rgba(31, 98, 201, 0.1);
      color: var(--blue);
    }

    .partial-box {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #edf0f5;
      opacity: 0.52;
      pointer-events: none;
    }

    .date-card.partial-active .partial-box {
      background: #e8f1ff;
      opacity: 1;
      pointer-events: auto;
    }

    .time-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 34px;
      align-items: center;
      gap: 6px;
    }

    .time-group {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 5px;
    }

    .time-input {
      min-width: 0;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 5px;
      background: #f3f5f9;
      color: var(--ink);
    }

    .date-card.partial-active .time-input {
      border-color: #9dbbec;
      background: #f8fbff;
      color: var(--ink);
    }

    .time-input:disabled {
      color: transparent;
    }

    .dash {
      color: var(--muted);
      font-weight: 900;
    }

    .date-card.partial-active .dash {
      color: var(--blue);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--navy);
      font-weight: 900;
      line-height: 1;
    }

    .icon-button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .add-time {
      justify-self: start;
      min-height: 34px;
      border: 1px solid rgba(31, 98, 201, 0.24);
      border-radius: 8px;
      background: rgba(31, 98, 201, 0.08);
      color: var(--blue);
      font-weight: 900;
      padding: 0 12px;
    }

    .add-time:disabled {
      border-color: var(--line);
      background: #f2f4f7;
      color: #98a2b3;
      cursor: default;
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .secondary,
    .primary {
      min-height: 48px;
      border-radius: 8px;
      font-weight: 900;
      padding: 0 18px;
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
    }

    .danger {
      border-color: rgba(214, 59, 56, 0.34);
      color: var(--red);
    }

    .field-action {
      min-height: 48px;
      white-space: nowrap;
    }

    .compact {
      min-height: 38px;
      padding: 0 12px;
      font-size: 14px;
    }

    .primary {
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      min-width: 124px;
    }

    .admin-panel {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid rgba(31, 98, 201, 0.2);
      border-radius: 8px;
      background: rgba(31, 98, 201, 0.06);
    }

    .admin-panel.active {
      display: grid;
      gap: 10px;
    }

    .admin-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--navy);
      font-weight: 900;
    }

    .admin-list {
      display: grid;
      gap: 8px;
    }

    .admin-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .admin-person {
      min-width: 0;
      color: var(--navy);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .calendar-panel {
      padding: 22px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      color: var(--navy);
      font-size: 22px;
      letter-spacing: 0;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--line);
      gap: 1px;
    }

    .week-head,
    .day-cell {
      background: #fff;
    }

    .week-head {
      min-height: 42px;
      display: grid;
      place-items: center;
      color: var(--navy);
      font-weight: 900;
    }

    .week-head.sun {
      color: var(--red);
    }

    .week-head.sat {
      color: var(--blue);
    }

    .day-cell {
      min-height: 128px;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 7px;
      transition: background-color 140ms ease, min-height 140ms ease;
    }

    .day-cell:hover {
      background: #eef6ff;
    }

    .day-cell.expandable {
      cursor: pointer;
    }

    .day-cell.expanded {
      min-height: 190px;
    }

    .day-number {
      font-weight: 900;
      color: var(--navy);
    }

    .day-number.sun {
      color: var(--red);
    }

    .day-number.sat {
      color: var(--blue);
    }

    .special-label {
      display: block;
      width: fit-content;
      border-radius: 7px;
      background: rgba(21, 127, 91, 0.12);
      color: var(--green);
      padding: 4px 7px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }

    .special-label.election {
      background: rgba(214, 59, 56, 0.12);
      color: var(--red);
    }

    .entry {
      display: block;
      width: 100%;
      border-radius: 7px;
      background: rgba(31, 98, 201, 0.1);
      color: #153e83;
      padding: 5px 6px;
      font-size: clamp(11px, 0.95vw, 13px);
      font-weight: 800;
      line-height: 1.3;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .entry.draft {
      background: rgba(248, 200, 70, 0.28);
      color: #694f00;
    }

    .day-cell:not(.expanded) .entry {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .more-entry {
      display: block;
      width: fit-content;
      border: 0;
      border-radius: 7px;
      background: rgba(23, 35, 63, 0.08);
      color: var(--navy);
      padding: 5px 7px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }

    .empty {
      color: #9aa4b2;
      font-size: 13px;
      font-weight: 700;
    }

    .popup-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(23, 35, 63, 0.34);
      z-index: 10;
    }

    .popup-backdrop.active {
      display: grid;
    }

    .popup {
      width: min(420px, 100%);
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .popup-message {
      margin: 0;
      color: var(--navy);
      font-weight: 900;
      line-height: 1.5;
    }

    .popup .primary {
      justify-self: end;
      min-width: 80px;
    }

    @media (max-width: 980px) {
      .date-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .date-grid {
        grid-template-columns: 1fr;
      }

      .form-panel,
      .calendar-panel {
        padding: 14px;
      }

      .calendar {
        min-width: 760px;
      }

      .calendar-scroll {
        overflow-x: auto;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <div class="badge">2026.5.21 - 2026.6.2</div>
        <h1>김병혁 후보 선거운동 지원 일정 취합</h1>
      </div>
    </header>

    <section class="layout">
      <form class="panel form-panel" id="scheduleForm" novalidate>
        <div class="field-row">
          <label>
            이름
            <input class="name-input" id="volunteerName" name="volunteerName" type="text" placeholder="홍길동" autocomplete="name" required>
          </label>
          <label>
            비밀번호(숫자 네 자리)
            <input class="pin-input" id="volunteerPin" name="volunteerPin" type="password" maxlength="12" placeholder="네 자리 숫자" autocomplete="off" required>
          </label>
          <button class="secondary field-action" type="button" id="loadMine">내 일정 불러오기(일정 수정용)</button>
          <div class="status" id="status" aria-live="polite"></div>
        </div>

        <div class="date-grid" id="dateGrid"></div>

        <div class="submit-row">
          <button class="secondary" type="button" id="clearDraft">입력 초기화</button>
          <button class="primary" type="button" id="saveSchedule">제출/수정 저장</button>
        </div>

        <div class="admin-panel" id="adminPanel">
          <div class="admin-title">
            <span>마스터 모드</span>
            <span id="adminCount"></span>
          </div>
          <div class="admin-list" id="adminList"></div>
        </div>
      </form>

      <section class="panel calendar-panel" aria-labelledby="calendarTitle">
        <div class="section-title">
          <h2 id="calendarTitle">입력이 반영된 달력</h2>
        </div>
        <div class="calendar-scroll">
          <div class="calendar" id="calendar"></div>
        </div>
      </section>
    </section>
  </main>

  <div class="popup-backdrop" id="popupBackdrop" role="dialog" aria-modal="true" aria-labelledby="popupMessage">
    <div class="popup">
      <p class="popup-message" id="popupMessage"></p>
      <button class="primary" type="button" id="popupClose">확인</button>
    </div>
  </div>

  <script>
    const campaignDates = [
      "2026-05-21", "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25",
      "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30",
      "2026-05-31", "2026-06-01", "2026-06-02"
    ];
    const calendarDates = [
      "2026-05-17", "2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21",
      "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26",
      "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31",
      "2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05",
      "2026-06-06"
    ];
    const weekNames = ["일", "월", "화", "수", "목", "금", "토"];
    const storageKey = "kim-byeonghyeok-campaign-schedule";
    const supabaseUrl = "https://hylzhogzakuhjmgirxro.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5bHpob2d6YWt1aGptZ2lyeHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNjQxNTQsImV4cCI6MjA5Mzk0MDE1NH0.LVDHt48_cXECw_Lw68TAQ1joA2MS_0yB6tUMZB6JZNY";
    const supabaseTable = "campaign_schedules";
    const adminPassword = "admin";
    const collapsedEntryLimit = 3;
    const specialDates = {
      "2026-05-21": { text: "본선거 시작", type: "start" },
      "2026-05-25": { text: "석가탄신일 대체휴일", type: "holiday" },
      "2026-06-03": { text: "선거일", type: "election" }
    };

    const state = {
      draft: {},
      saved: loadSaved(),
      adminTarget: null,
      expandedDates: new Set(),
      syncing: false
    };

    const nameInput = document.querySelector("#volunteerName");
    const pinInput = document.querySelector("#volunteerPin");
    const dateGrid = document.querySelector("#dateGrid");
    const calendar = document.querySelector("#calendar");
    const form = document.querySelector("#scheduleForm");
    const status = document.querySelector("#status");
    const adminPanel = document.querySelector("#adminPanel");
    const adminList = document.querySelector("#adminList");
    const adminCount = document.querySelector("#adminCount");
    const popupBackdrop = document.querySelector("#popupBackdrop");
    const popupMessage = document.querySelector("#popupMessage");
    const popupClose = document.querySelector("#popupClose");

    function showPopup(message) {
      popupMessage.textContent = message;
      popupBackdrop.classList.add("active");
      popupClose.focus();
    }

    function hidePopup() {
      popupBackdrop.classList.remove("active");
    }

    function errorMessage(error) {
      return error && error.message ? error.message : String(error || "알 수 없는 오류");
    }

    function usingSupabase() {
      return supabaseUrl.startsWith("https://") && supabaseAnonKey.length > 20;
    }

    function loadSaved() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch {
        return [];
      }
    }

    function saveEntries() {
      localStorage.setItem(storageKey, JSON.stringify(state.saved));
    }

    function supabaseHeaders(extra = {}) {
      return {
        apikey: supabaseAnonKey,
        Authorization: `Bearer ${supabaseAnonKey}`,
        "Content-Type": "application/json",
        ...extra
      };
    }

    function supabaseEndpoint(query = "") {
      const base = `${supabaseUrl.replace(/\/$/, "")}/rest/v1/${supabaseTable}`;
      return query ? `${base}?${query}` : base;
    }

    function rowToEntry(row) {
      return {
        date: row.date,
        name: row.name,
        pin: row.pin,
        item: {
          mode: row.mode,
          times: Array.isArray(row.times) ? row.times : []
        },
        text: row.text
      };
    }

    function entryToRow(entry) {
      return {
        date: entry.date,
        name: entry.name,
        pin: entry.pin,
        mode: entry.item.mode,
        times: entry.item.times || [],
        text: entry.text
      };
    }

    async function refreshSavedEntries() {
      if (!usingSupabase()) {
        state.saved = loadSaved();
        renderCalendar();
        renderAdminPanel();
        return;
      }
      try {
        state.syncing = true;
        status.textContent = "일정을 불러오는 중입니다.";
        const response = await fetch(supabaseEndpoint("select=date,name,pin,mode,times,text&order=date.asc,name.asc"), {
          headers: supabaseHeaders()
        });
        if (!response.ok) throw new Error(await response.text());
        const rows = await response.json();
        state.saved = rows.map(rowToEntry);
        status.textContent = "";
        renderCalendar();
        renderAdminPanel();
      } catch (error) {
        status.textContent = "Supabase 연결을 확인해 주세요.";
        showPopup(`Supabase 연결 오류: ${errorMessage(error)}`);
        console.error(error);
      } finally {
        state.syncing = false;
      }
    }

    async function replacePersonEntries(target, entries) {
      if (!usingSupabase()) {
        state.saved = state.saved.filter((entry) => !isMine(entry, target));
        state.saved.push(...entries);
        saveEntries();
        renderCalendar();
        renderAdminPanel();
        return;
      }
      const filter = `name=eq.${encodeURIComponent(target.name)}&pin=eq.${encodeURIComponent(target.pin)}`;
      const deleteResponse = await fetch(supabaseEndpoint(filter), {
        method: "DELETE",
        headers: supabaseHeaders()
      });
      if (!deleteResponse.ok) throw new Error(await deleteResponse.text());

      if (entries.length) {
        const insertResponse = await fetch(supabaseEndpoint(), {
          method: "POST",
          headers: supabaseHeaders({ Prefer: "return=minimal" }),
          body: JSON.stringify(entries.map(entryToRow))
        });
        if (!insertResponse.ok) throw new Error(await insertResponse.text());
      }

      await refreshSavedEntries();
    }

    function toDate(dateText) {
      return new Date(`${dateText}T00:00:00`);
    }

    function compactDate(dateText) {
      const date = toDate(dateText);
      return `${date.getMonth() + 1}.${date.getDate()}`;
    }

    function dayClass(dateText) {
      const day = toDate(dateText).getDay();
      if (["election", "holiday"].includes(specialDates[dateText]?.type)) return "sun";
      if (day === 0) return "sun";
      if (day === 6) return "sat";
      return "";
    }

    function dayLabel(dateText) {
      const day = weekNames[toDate(dateText).getDay()];
      const special = specialDates[dateText];
      if (special?.type === "holiday") {
        return `${day}요일 (${special.text})`;
      }
      return `${day}요일`;
    }

    function parseTimeParts(value) {
      if (!value) return { hour: "", minute: "" };
      const [hour = "", minute = ""] = value.split(":");
      return {
        hour: hour.padStart(2, "0"),
        minute: minute === "30" ? "30" : "00"
      };
    }

    function hourOptions(selected) {
      const options = ['<option value="">시</option>'];
      for (let hour = 0; hour < 24; hour += 1) {
        const value = String(hour).padStart(2, "0");
        options.push(`<option value="${value}" ${value === selected ? "selected" : ""}>${value}</option>`);
      }
      return options.join("");
    }

    function minuteOptions(selected) {
      return ["", "00", "30"]
        .map((value) => {
          const label = value || "분";
          return `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`;
        })
        .join("");
    }

    function selectedTime(row, side) {
      const hour = row.querySelector(`.${side}-hour`).value;
      const minute = row.querySelector(`.${side}-minute`).value;
      if (!hour || !minute) return "";
      return `${hour}:${minute}`;
    }

    function makeTimeRow(card, dateText, value = {}) {
      const row = document.createElement("div");
      row.className = "time-row";
      const start = parseTimeParts(value.start);
      const end = parseTimeParts(value.end);
      row.innerHTML = `
        <div class="time-group" aria-label="${compactDate(dateText)} 시작 시간">
          <select class="time-input time-select start-hour" aria-label="${compactDate(dateText)} 시작 시">${hourOptions(start.hour)}</select>
          <select class="time-input time-select start-minute" aria-label="${compactDate(dateText)} 시작 분">${minuteOptions(start.minute)}</select>
        </div>
        <span class="dash">-</span>
        <div class="time-group" aria-label="${compactDate(dateText)} 종료 시간">
          <select class="time-input time-select end-hour" aria-label="${compactDate(dateText)} 종료 시">${hourOptions(end.hour)}</select>
          <select class="time-input time-select end-minute" aria-label="${compactDate(dateText)} 종료 분">${minuteOptions(end.minute)}</select>
        </div>
        <button class="icon-button remove-time" type="button" aria-label="시간 삭제">×</button>
      `;
      row.querySelectorAll("select").forEach((input) => {
        input.addEventListener("change", () => {
          setPartialMode(card, dateText);
          updateDraftFromCard(card, dateText);
        });
      });
      row.querySelector(".remove-time").addEventListener("click", () => {
        const rows = card.querySelectorAll(".time-row");
        if (rows.length > 1) {
          row.remove();
        } else {
          row.querySelectorAll("select").forEach((input) => input.value = "");
        }
        setPartialMode(card, dateText);
        updateDraftFromCard(card, dateText);
      });
      return row;
    }

    function buildDateCards() {
      dateGrid.innerHTML = "";
      campaignDates.forEach((dateText) => {
        const card = document.createElement("article");
        card.className = "date-card";
        card.dataset.date = dateText;
        const dateClass = dayClass(dateText);
        card.innerHTML = `
          <div class="date-top">
            <div class="date-label ${dateClass}">${compactDate(dateText)}</div>
            <div class="day-name ${dateClass}">${dayLabel(dateText)}</div>
          </div>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="mode-${dateText}" value="full">
              <span>전일결합</span>
            </label>
            <label class="choice">
              <input type="radio" name="mode-${dateText}" value="partial">
              <span>부분결합</span>
            </label>
          </div>
          <div class="partial-box"></div>
          <button class="add-time" type="button">시간대 추가</button>
        `;

        const partialBox = card.querySelector(".partial-box");
        partialBox.appendChild(makeTimeRow(card, dateText));
        setPartialControls(card, false);

        card.querySelectorAll("input[type='radio']").forEach((radio) => {
          radio.addEventListener("pointerdown", () => {
            radio.dataset.wasChecked = String(radio.checked);
          });
          radio.addEventListener("click", () => {
            if (radio.dataset.wasChecked === "true") {
              radio.checked = false;
              radio.dataset.wasChecked = "false";
              updateDraftFromCard(card, dateText);
            }
          });
          radio.addEventListener("change", () => updateDraftFromCard(card, dateText));
        });
        card.querySelector(".add-time").addEventListener("click", () => {
          setPartialMode(card, dateText);
          partialBox.appendChild(makeTimeRow(card, dateText));
          updateDraftFromCard(card, dateText);
        });
        dateGrid.appendChild(card);
      });
    }

    function setPartialControls(card, active) {
      card.classList.toggle("partial-active", active);
      card.querySelectorAll(".partial-box select, .partial-box button, .add-time").forEach((control) => {
        control.disabled = !active;
      });
    }

    function setPartialMode(card, dateText) {
      const partial = card.querySelector(`input[name="mode-${dateText}"][value="partial"]`);
      partial.checked = true;
      setPartialControls(card, true);
    }

    function selectedMode(card, dateText) {
      const selected = card.querySelector(`input[name="mode-${dateText}"]:checked`);
      return selected ? selected.value : "";
    }

    function updateDraftFromCard(card, dateText) {
      const mode = selectedMode(card, dateText);
      if (!mode) {
        delete state.draft[dateText];
        setPartialControls(card, false);
      } else if (mode === "full") {
        state.draft[dateText] = { mode: "full", times: [] };
        setPartialControls(card, false);
      } else {
        setPartialControls(card, true);
        const times = Array.from(card.querySelectorAll(".time-row"))
          .map((row) => ({
            start: selectedTime(row, "start"),
            end: selectedTime(row, "end")
          }))
          .filter((time) => time.start || time.end);
        state.draft[dateText] = { mode: "partial", times };
      }
      renderCalendar();
    }

    function draftEntries() {
      const name = nameInput.value.trim() || "홍길동";
      return Object.entries(state.draft)
        .map(([date, item]) => formatEntry(name, "", date, item, true))
        .filter(Boolean);
    }

    function formatEntry(name, pin, date, item, draft = false) {
      if (item.mode === "full") {
        return { date, name, pin, item: { mode: "full", times: [] }, text: `${name}: 전일`, draft };
      }
      const times = item.times
        .filter((time) => time.start && time.end)
        .map((time) => `${time.start}-${time.end}`);
      if (!times.length) return null;
      return {
        date,
        name,
        pin,
        item: { mode: "partial", times: item.times.filter((time) => time.start && time.end) },
        text: `${name}: ${times.join(", ")}`,
        draft
      };
    }

    function isAdminMode() {
      return pinInput.value.trim().toLowerCase() === adminPassword;
    }

    function personKey(identity) {
      return `${identity.name}\u001f${identity.pin}`;
    }

    function savedPeople() {
      const people = new Map();
      state.saved.forEach((entry) => {
        if (!entry.name || !entry.pin) return;
        const key = personKey(entry);
        const person = people.get(key) || { name: entry.name, pin: entry.pin, count: 0 };
        person.count += 1;
        people.set(key, person);
      });
      return Array.from(people.values()).sort((a, b) => a.name.localeCompare(b.name, "ko"));
    }

    function renderAdminPanel() {
      const active = isAdminMode();
      adminPanel.classList.toggle("active", active);
      adminList.innerHTML = "";
      adminCount.textContent = "";
      if (!active) {
        state.adminTarget = null;
        return;
      }

      const people = savedPeople();
      adminCount.textContent = `${people.length}명`;
      if (!people.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "제출된 일정이 없습니다.";
        adminList.appendChild(empty);
        return;
      }

      people.forEach((person) => {
        const item = document.createElement("div");
        item.className = "admin-item";
        item.dataset.name = person.name;
        item.dataset.pin = person.pin;
        const label = document.createElement("div");
        label.className = "admin-person";
        label.textContent = `${person.name} · ${person.count}개 일정`;
        const loadButton = document.createElement("button");
        loadButton.className = "secondary compact";
        loadButton.type = "button";
        loadButton.dataset.action = "load";
        loadButton.textContent = "불러오기";
        const deleteButton = document.createElement("button");
        deleteButton.className = "secondary compact danger";
        deleteButton.type = "button";
        deleteButton.dataset.action = "delete";
        deleteButton.textContent = "삭제";
        item.append(label, loadButton, deleteButton);
        adminList.appendChild(item);
      });
    }

    function validateIdentity() {
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim().toLowerCase();
      if (pin === adminPassword) {
        return { name, pin, admin: true };
      }
      if (!name) {
        nameInput.focus();
        status.textContent = "이름을 입력해 주세요.";
        return null;
      }
      if (!/^[0-9]{4}$/.test(pin)) {
        pinInput.focus();
        status.textContent = "네 자리 숫자 비밀번호를 입력해 주세요.";
        return null;
      }
      return { name, pin, admin: false };
    }

    function readTypedIdentity() {
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim().toLowerCase();
      if (name && /^[0-9]{4}$/.test(pin)) {
        return { name, pin, admin: false };
      }
      if (pin === adminPassword && state.adminTarget) {
        return state.adminTarget;
      }
      return null;
    }

    function isMine(entry, identity) {
      return entry.name === identity.name && entry.pin === identity.pin;
    }

    function resetSchedule() {
      state.draft = {};
      document.querySelectorAll(".date-card").forEach((card) => {
        card.querySelectorAll("input[type='radio']").forEach((radio) => radio.checked = false);
        const partialBox = card.querySelector(".partial-box");
        partialBox.innerHTML = "";
        partialBox.appendChild(makeTimeRow(card, card.dataset.date));
        setPartialControls(card, false);
      });
    }

    function fillCardFromItem(dateText, item) {
      const card = document.querySelector(`.date-card[data-date="${dateText}"]`);
      if (!card || !item) return;
      const radio = card.querySelector(`input[name="mode-${dateText}"][value="${item.mode}"]`);
      if (radio) radio.checked = true;
      const partialBox = card.querySelector(".partial-box");
      partialBox.innerHTML = "";
      if (item.mode === "partial") {
        const times = item.times.length ? item.times : [{}];
        times.forEach((time) => partialBox.appendChild(makeTimeRow(card, dateText, time)));
        setPartialControls(card, true);
      } else {
        partialBox.appendChild(makeTimeRow(card, dateText));
        setPartialControls(card, false);
      }
      state.draft[dateText] = { mode: item.mode, times: item.times || [] };
    }

    function loadAdminTarget(identity) {
      state.adminTarget = {
        name: identity.name,
        pin: identity.pin,
        originalName: identity.name,
        originalPin: identity.pin
      };
      nameInput.value = identity.name;
      resetSchedule();
      state.saved
        .filter((entry) => isMine(entry, { name: identity.name, pin: identity.pin }))
        .forEach((entry) => fillCardFromItem(entry.date, entry.item));
      status.textContent = `${identity.name} 일정 수정 중`;
      renderCalendar();
      renderAdminPanel();
    }

    async function deleteAdminTarget(identity) {
      const targetKey = personKey(identity);
      if ((state.adminTarget && personKey(state.adminTarget) === targetKey) || nameInput.value.trim() === identity.name) {
        state.adminTarget = null;
        resetSchedule();
        nameInput.value = "";
      }
      try {
        await replacePersonEntries(identity, []);
        status.textContent = "";
      } catch (error) {
        status.textContent = "삭제 중 오류가 발생했습니다.";
        showPopup(`삭제 중 오류가 발생했습니다: ${errorMessage(error)}`);
        console.error(error);
      }
    }

    function handleAdminListClick(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const item = button.closest(".admin-item");
      if (!item) return;
      const identity = {
        name: item.dataset.name || "",
        pin: item.dataset.pin || ""
      };
      if (!identity.name || !identity.pin) return;
      if (button.dataset.action === "load") {
        loadAdminTarget(identity);
        return;
      }
      if (button.dataset.action === "delete") {
        deleteAdminTarget(identity);
      }
    }

    async function loadMine() {
      if (usingSupabase()) await refreshSavedEntries();
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim().toLowerCase();
      if (!name || !pin) {
        showPopup("불러올 일정이 없습니다. 이름과 네 자리 비밀번호를 새로 입력하고 일정 체크 후 제출해 주세요.");
        return;
      }
      if (pin !== adminPassword && !/^[0-9]{4}$/.test(pin)) {
        showPopup("이름과 비밀번호가 일치하지 않습니다.");
        return;
      }
      const identity = pin === adminPassword
        ? { name, pin, admin: true }
        : { name, pin, admin: false };
      if (identity.admin) {
        const matches = savedPeople().filter((person) => person.name === identity.name);
        if (matches.length === 1) {
          loadAdminTarget(matches[0]);
        } else if (matches.length > 1) {
          status.textContent = "동명이인이 있어 아래 목록에서 선택해 주세요.";
        } else {
          status.textContent = "아래 목록에서 수정할 사람을 선택해 주세요.";
        }
        return;
      }
      const mine = state.saved.filter((entry) => isMine(entry, identity));
      if (!mine.length) {
        showPopup("이름과 비밀번호가 일치하지 않습니다.");
        return;
      }
      resetSchedule();
      mine.forEach((entry) => fillCardFromItem(entry.date, entry.item));
      showPopup("일정을 불러왔습니다. 수정 후 제출하시면 됩니다.");
      status.textContent = "";
      renderCalendar();
    }

    function renderCalendar() {
      calendar.innerHTML = "";
      weekNames.forEach((name, index) => {
        const head = document.createElement("div");
        head.className = `week-head ${index === 0 ? "sun" : index === 6 ? "sat" : ""}`;
        head.textContent = name;
        calendar.appendChild(head);
      });

      const draft = draftEntries();
      const currentIdentity = readTypedIdentity();
      const savedEntries = currentIdentity && draft.length
        ? state.saved.filter((entry) => !isMine(entry, currentIdentity))
        : state.saved;
      const allEntries = [...savedEntries, ...draft];
      calendarDates.forEach((dateText) => {
        const entries = allEntries.filter((entry) => entry.date === dateText);
        const hasOverflow = entries.length > collapsedEntryLimit;
        const isExpanded = state.expandedDates.has(dateText);
        const visibleEntries = hasOverflow && !isExpanded
          ? entries.slice(0, collapsedEntryLimit)
          : entries;
        const cell = document.createElement("div");
        cell.className = `day-cell ${hasOverflow ? "expandable" : ""} ${isExpanded ? "expanded" : ""}`;
        cell.dataset.date = dateText;
        if (hasOverflow) {
          cell.setAttribute("role", "button");
          cell.setAttribute("tabindex", "0");
          cell.setAttribute("aria-expanded", String(isExpanded));
          cell.setAttribute("aria-label", `${compactDate(dateText)} 일정 ${isExpanded ? "접기" : "펼치기"}`);
          cell.addEventListener("click", () => toggleCalendarDate(dateText));
          cell.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleCalendarDate(dateText);
            }
          });
        }
        const number = document.createElement("div");
        number.className = `day-number ${dayClass(dateText)}`;
        number.textContent = compactDate(dateText);
        cell.appendChild(number);
        if (specialDates[dateText]) {
          const special = document.createElement("span");
          special.className = `special-label ${["election", "holiday"].includes(specialDates[dateText].type) ? "election" : ""}`;
          special.textContent = specialDates[dateText].text;
          cell.appendChild(special);
        }

        if (entries.length) {
          visibleEntries.forEach((entry) => {
            const line = document.createElement("span");
            line.className = `entry ${entry.draft ? "draft" : ""}`;
            line.textContent = entry.text;
            cell.appendChild(line);
          });
          if (hasOverflow && !isExpanded) {
            const more = document.createElement("span");
            more.className = "more-entry";
            more.textContent = `+ 외 ${entries.length - collapsedEntryLimit}명`;
            cell.appendChild(more);
          }
        } else {
          const empty = document.createElement("span");
          empty.className = "empty";
          empty.textContent = "";
          cell.appendChild(empty);
        }
        calendar.appendChild(cell);
      });
    }

    function toggleCalendarDate(dateText) {
      if (state.expandedDates.has(dateText)) {
        state.expandedDates.delete(dateText);
      } else {
        state.expandedDates.add(dateText);
      }
      renderCalendar();
    }

    function clearDraft(options = {}) {
      const keepIdentity = Boolean(options.keepIdentity);
      const keepAdminTarget = Boolean(options.keepAdminTarget);
      resetSchedule();
      if (!keepAdminTarget) state.adminTarget = null;
      if (!keepIdentity) {
        nameInput.value = "";
        pinInput.value = "";
      }
      status.textContent = "";
      renderCalendar();
      renderAdminPanel();
    }

    async function saveSchedule() {
      const identity = validateIdentity();
      if (!identity) return;
      if (identity.admin && !state.adminTarget) {
        status.textContent = "아래 목록에서 수정할 사람을 먼저 불러와 주세요.";
        return;
      }
      const saveName = identity.admin ? (identity.name || state.adminTarget.name) : identity.name;
      const savePin = identity.admin ? state.adminTarget.originalPin : identity.pin;
      const replaceTarget = identity.admin
        ? { name: state.adminTarget.originalName, pin: state.adminTarget.originalPin }
        : identity;
      if (identity.admin && savePin === adminPassword) {
        status.textContent = "관리자 비밀번호는 참여자 비밀번호로 저장할 수 없습니다.";
        return;
      }
      const entries = Object.entries(state.draft)
        .map(([date, item]) => formatEntry(saveName, savePin, date, item))
        .filter(Boolean);
      try {
        await replacePersonEntries(replaceTarget, entries);
        if (identity.admin) {
          state.adminTarget = {
            name: saveName,
            pin: savePin,
            originalName: saveName,
            originalPin: savePin
          };
        }
        clearDraft();
        showPopup("제출했습니다.");
        status.textContent = "";
      } catch (error) {
        status.textContent = "저장 중 오류가 발생했습니다.";
        showPopup(`저장 중 오류가 발생했습니다: ${errorMessage(error)}`);
        console.error(error);
      }
    }

    nameInput.addEventListener("input", renderCalendar);
    pinInput.addEventListener("input", () => {
      const value = pinInput.value.trim().toLowerCase();
      if (adminPassword.startsWith(value)) {
        pinInput.value = value;
      } else {
        pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 4);
      }
      renderAdminPanel();
    });
    popupClose.addEventListener("click", hidePopup);
    popupBackdrop.addEventListener("click", (event) => {
      if (event.target === popupBackdrop) hidePopup();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hidePopup();
    });
    document.querySelector("#clearDraft").addEventListener("click", () => {
      clearDraft({ keepIdentity: true, keepAdminTarget: true });
    });
    document.querySelector("#loadMine").addEventListener("click", loadMine);
    document.querySelector("#saveSchedule").addEventListener("click", saveSchedule);
    adminList.addEventListener("click", handleAdminListClick);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      saveSchedule();
    });

    buildDateCards();
    renderCalendar();
    renderAdminPanel();
    refreshSavedEntries();
  </script>
</body>
</html>
